# Checks the documents on every pull request that touches them, on main, and on
# release tags.
#
# Integrity runs scripts/check_docs.py: the card in CARD.md must match the card
# in FOUNDATIONAL.md exactly, FOUNDATIONAL.md, README.md, and CHANGELOG.md must
# name the same version, and a v* tag must match that version.
#
# Markdown lints every .md file with the settings in .markdownlint-cli2.yaml.
#
# Links are checked separately by check-links.yml.

name: Check documents

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check_docs.py'
      - '.markdownlint-cli2.yaml'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**/*.md'
      - 'scripts/check_docs.py'
      - '.markdownlint-cli2.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: Document integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check document consistency
        run: python scripts/check_docs.py

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 '**/*.md'
